<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>肺炎分析系统 (PAS)</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container mt-5">
        <div class="row">
            <div class="col-md-12 text-center mb-4">
                <h1>肺炎分析系统</h1>
                <p class="lead">基于CNN的胸部X光片肺炎检测系统</p>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6 offset-md-3">
                <div class="card mb-4">
                    <div class="card-header bg-primary text-white">
                        <h5 class="card-title mb-0">上传胸部X光片</h5>
                    </div>
                    <div class="card-body">
                        <form id="upload-form" enctype="multipart/form-data">
                            <div class="mb-3">
                                <label for="file-input" class="form-label">选择图像文件 (JPG, PNG)</label>
                                <input class="form-control" type="file" id="file-input" accept=".jpg,.jpeg,.png">
                            </div>
                            <div class="d-grid">
                                <button class="btn btn-primary" type="submit" id="analyze-btn">分析图像</button>
                            </div>
                        </form>
                    </div>
                </div>

                <div id="progress-container" class="d-none">
                    <div class="progress mb-3">
                        <div class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width: 100%"></div>
                    </div>
                    <p class="text-center">正在分析图像，请稍候...</p>
                </div>

                <div id="result-container" class="d-none">
                    <div class="card">
                        <div class="card-header bg-info text-white">
                            <h5 class="card-title mb-0">分析结果</h5>
                        </div>
                        <div class="card-body">
                            <div id="result-content">
                                <!-- 结果将在这里显示 -->
                            </div>
                            
                            <div class="text-center mt-3">
                                <img id="result-image" class="img-fluid" src="" alt="分析结果可视化">
                            </div>
                            
                            <div class="mt-4">
                                <h6>分类概率:</h6>
                                <div id="probability-bars">
                                    <!-- 概率条将在这里显示 -->
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mt-5">
            <div class="col-md-12 text-center">
                <p class="text-muted">© 2025 肺炎分析系统 (PAS) - 基于CNN的肺炎诊断辅助工具</p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
